[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-sentinel"
version = "0.3.0"
description = "Autonomous SRE agents that watch your services, detect anomalies, and generate blameless postmortems"
readme = "README.md"
license = "MIT"
authors = [
    {name = "jagadeep.mamidi", email = "jagadeep.mamidi@gmail.com"}
]
keywords = ["devops", "sre", "monitoring", "incident-management", "ai", "postmortem"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.10"

dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "httpx>=0.25",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "supabase>=2.0",
    "langchain-core>=0.1.30",
    "langchain-openai>=0.1.0",
    "crewai==0.51.0",
    "crewai-tools==0.8.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.22",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "dnspython>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "fastapi>=0.100",
    "email-validator>=2.0",
    "ruff>=0.1.11",
    "bandit>=1.7.7",
    "build>=1.0",
    "twine>=5.0",
]
ai = [
    "openai>=1.0",
    "anthropic>=0.18",
]
mcp = [
    "mcp>=1.2",
]
all = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "fastapi>=0.100",
    "email-validator>=2.0",
    "openai>=1.0",
    "anthropic>=0.18",
    "mcp>=1.2",
]

[project.scripts]
sentinel = "sentinel.cli.main:cli"
devops-sentinel-mcp = "sentinel.mcp.server:main"

[project.urls]
Homepage = "https://github.com/jagadeepmamidi/devops-sentinel"
Documentation = "https://devops-sentinel-seven.vercel.app/"
Repository = "https://github.com/jagadeepmamidi/devops-sentinel"
Issues = "https://github.com/jagadeepmamidi/devops-sentinel/issues"

[tool.setuptools]
packages = ["sentinel", "sentinel.cli", "sentinel.core", "sentinel.api", "sentinel.auth", "sentinel.integrations", "sentinel.ml", "sentinel.notifications", "sentinel.setup", "sentinel.tools"]
py-modules = ["agents", "api_server", "config", "main", "models", "orchestrator", "server", "tasks"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

