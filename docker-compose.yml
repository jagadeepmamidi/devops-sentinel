services:
  sentinel:
    build: .
    container_name: devops-sentinel
    ports:
      - "8080:8080"
    environment:
      - SENTINEL_MODE=local
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    volumes:
      - ./mock_service:/app/mock_service:ro
    depends_on:
      - mock-service
    restart: unless-stopped
    networks:
      - sentinel-network

  mock-service:
    build:
      context: ./mock_service
      dockerfile: Dockerfile
    container_name: mock-service
    ports:
      - "8000:8000"
    volumes:
      - ./mock_service:/app
    restart: unless-stopped
    networks:
      - sentinel-network

networks:
  sentinel-network:
    driver: bridge
