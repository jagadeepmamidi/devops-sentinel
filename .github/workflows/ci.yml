name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install -e ".[dev]"
          python -c "import fastapi; print('fastapi', fastapi.__version__)"
      
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -o addopts=""

      - name: API smoke test
        run: |
          python -c "from sentinel.api.app import create_app; from fastapi.testclient import TestClient; client=TestClient(create_app()); assert client.get('/health').status_code == 200; assert client.get('/api/status').status_code == 200"

      - name: Check package build
        run: |
          rm -rf build dist devops_sentinel.egg-info
          python -m pip install build twine
          python -m build --wheel
          python -m twine check dist/*

      - name: Run lint and security checks
        run: |
          python -m pip install ruff bandit
          # Gate on syntax and undefined-name errors while the legacy codebase
          # is incrementally brought to full style compliance.
          ruff check . --select E9,F63,F7,F82
          # Fail only on high-severity Bandit findings. Lower-severity legacy
          # findings remain visible in local security reports.
          bandit -r src -lll
      
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
