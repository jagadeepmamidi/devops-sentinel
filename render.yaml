# Render.com Deployment Configuration
# See: https://render.com/docs/blueprint-spec

services:
  # API Server
  - type: web
    name: devops-sentinel-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install .
    startCommand: python -m uvicorn sentinel.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: ENVIRONMENT
        value: production

  # Web site + public CLI demo endpoints (/api/demo/*)
  - type: web
    name: devops-sentinel-web
    env: node
    region: oregon
    plan: free
    buildCommand: cd web && npm install && npm run build
    startCommand: cd web && node server.mjs
    healthCheckPath: /api/demo/ok
